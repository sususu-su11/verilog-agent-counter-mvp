name: trusted-verification-regression
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify reviewed trusted asset hashes
        run: python -m trusted.verify_manifest
      - name: Run offline adversarial tests
        run: python -m unittest discover -s tests -v

      - name: Backend and frontend syntax
        run: |
          python -m compileall -q app sandbox trusted scripts tests
          node --check app/static/app.js
          bash -n deploy.sh
  docker-containment-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned sandbox image
        run: docker build -t verilog-sandbox:local ./sandbox
      - name: Real Docker counter/sentinel/chaos regression (host asserts, no self-signoff)
        run: python3 -m scripts.real_sandbox_regression
