services:
  backend:
    build: .
    image: verilog-agent-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /srv
      INFERENCE_LEDGER_PATH: /state/quota.sqlite
    # Private mode: loopback/SSH. Public fixed-MOCK: explicit opt-in and edge firewall.
    # Docker socket is powerful even when the HTTP API accepts only fixed demo IDs.
    ports:
      - "${PUBLIC_BIND_HOST:-127.0.0.1}:${PUBLIC_PORT:-8000}:8000"
    volumes:
      # Rootful /var/run/docker.sock is supported for disposable public MOCK VM
      # but is a HIGH-RISK control-plane mount (backend compromise => host access).
      # Prefer rootless where available; production still requires rootless.
      - "${DOCKER_HOST_SOCKET:?Set an explicit audited Docker socket path}:/var/run/docker.sock"
      - ./state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128

  sandbox:
    profiles: ["build"]
    build: ./sandbox
    image: verilog-sandbox:local
